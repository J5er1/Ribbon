name: android

# The Kotlin port of RibbonCore is a plain JVM library, so its tests — the
# fire engine, the time rules, the book table — run here exactly as the
# Swift package's do, without a Mac and without an emulator. The app module
# is compiled and linted; running it on a device is still a local job.
#
# The two cores are checked against ported-across test suites on purpose: if
# the fire curve or the ~750-word scale boundary ever diverges between the
# platforms, a red build here is where it should surface.

on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `packages` is set only to drop the action's default `tools` from
      # it. That package is the long-obsolete SDK Tools bundle, Google has
      # withdrawn it from the repository, and sdkmanager exits 1 rather
      # than skipping a package it cannot find — so the default fails the
      # job during setup, before a line of Kotlin is compiled. Nothing in
      # this build ever used it: Gradle resolves the platform and
      # build-tools itself, under the licences this action accepts.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: RibbonCore (Kotlin) tests
        working-directory: android
        run: ./gradlew :core:test

      - name: App unit tests
        working-directory: android
        # Includes the wire-format tests: the Android client and the iOS
        # client write to one Supabase project, so the column names these
        # rows serialize to are the schema, not a private choice. A renamed
        # field compiles and round-trips against itself; it fails only in a
        # real room, on someone else's phone.
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble the app
        working-directory: android
        run: ./gradlew :app:assembleDebug

      # And the one people would actually install. This is not redundant with
      # the debug assemble above: release is the only configuration that runs
      # R8, and `proguardFiles` had named a `proguard-rules.pro` that did not
      # exist — so `:app:assembleRelease` failed at `minifyReleaseWithR8` for
      # as long as that line had been there, and nothing here ever ran it. The
      # app could not be built for release at all and CI was green (A49).
      #
      # It also catches what only R8 catches: a keep rule a library stopped
      # shipping, a reflective lookup the shrinker removes.
      - name: Assemble the release build
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug

      # There is still no emulator here, so the only way anyone sees this app
      # run is on a real phone (below). The look book is the nearest thing to
      # a second pair of eyes: it renders the room, the book and every
      # settings screen to PNGs, on both palettes — the wallpaper's and
      # Ribbon's own — from the app's real composables against a real store.
      # Download it from the run's summary page to see what a change actually
      # looks like before anybody installs anything.
      - name: Keep the look book, so the screens can be seen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ribbon-look-book
          path: android/app/build/shots
          if-no-files-found: warn
          retention-days: 14

      # There is no emulator in the environments this gets built in, so the
      # only way anyone sees the app actually run is on a real phone. This
      # is that: download the artifact from the run's summary page, open the
      # .apk on an Android 13+ device, and allow the install when it asks.
      # It installs as app.readribbon.debug, so it will not collide with
      # anything from Play later.
      #
      # It is a debug build signed with the runner's throwaway debug key —
      # fine for installing by hand, useless for distribution, and a new
      # key each run, so an update over a previous download will ask to
      # uninstall first.
      - name: Keep the APK, so it can be installed on a phone
        uses: actions/upload-artifact@v4
        with:
          name: ribbon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      # The in-app updater asks this file first, and it is the only signal
      # that actually works. A release's `published_at` does not move when
      # its assets are replaced — this one still reads September 8th — and
      # the release title carries no version, so UpdateService's two
      # fallbacks both come up empty and it concludes there is nothing new.
      # Without a fresh manifest the APK below lands on the release and no
      # phone is ever told. `versionCode` is the run number because that is
      # exactly what the APK was built with (app/build.gradle.kts reads
      # GITHUB_RUN_NUMBER), so the two can never disagree.
      - name: Write the version manifest the in-app updater reads
        if: github.ref == 'refs/heads/main'
        run: |
          cat > android/app/build/outputs/apk/debug/version.json <<JSON
          {"versionCode":${{ github.run_number }},"versionName":"0.1.${{ github.run_number }}","apkUrl":"https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk"}
          JSON
          cat android/app/build/outputs/apk/debug/version.json

      - name: Publish direct APK download release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Android Preview
          prerelease: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/version.json
