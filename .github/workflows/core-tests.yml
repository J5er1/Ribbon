name: core-tests

# RibbonCore is Foundation-only on purpose, so the fire engine, time rules,
# and book table are verified on every push without a Mac in the loop. The
# app target itself needs Xcode and is built locally.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run RibbonCore tests
        run: swift test --package-path core
